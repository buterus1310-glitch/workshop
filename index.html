function mkL0(k){const av=P.map((p,i)=>i).filter(i=>mats(P[i]).every(m=>S.eq[m])),big=k==='big',biz=isB(k);
 let pool=av;if(biz){const q=av.filter(i=>P[i][4]>=2);if(q.length)pool=q}
 const i=pool[Math.floor(Math.random()*pool.length)],p=P[i],D=S.ip&&Math.random()<.2?2+Math.floor(Math.random()*2):0,wm=(D?1.5:1)*(k!=='acq'&&bt('mgr')>=0?[1,1.2,1.5][bt('mgr')]:1)*(S.ip?1.4+Math.min(1.6,(S.m-(S.ipM||S.m))*.04):1)*(S.st.ooo&&biz?1.3:1),W=(biz?1+Math.random()*(big?2.5:1):.6+Math.random())*wm,m=(a,z)=>a+Math.random()*(z-a);

function base(){const rf=S.rating/3,s=sf(),o={},x={acq:8,avito:7,soc:4,blog:0,card:0,biz:S.rating>=3?3:0,big:S.ip&&S.rating>=3.5?1.2:0};

  h=`<div class="lbl">${S.ip?'ИП':'Самозанятый'}, месяц ${S.m}, ${s>1.12?'высокий сезон':s<.88?'низкий сезон':'обычный сезон'}</div><div class="nw">${F(S.cash)}</div>`;
  h+=`<div class="stats"><div class="lbl">Рейтинг<b>${R(S.rating)} из 5</b></div><div class="lbl">Силы<b>${E(S.energy)} из ${emax()}</b></div><div class="lbl">Опыт<b>${S.exp} заказов</b></div><div class="lbl">Ждём оплату<b>${F(rc)}</b></div><div class="lbl">Долг<b>${F(S.debt)}</b></div>${(()=>{const f=fixed(),w=f>0?Math.floor(Math.max(0,S.cash)/f):99;return`<div class="lbl">Запас<b class="${f>0&&w<2?'r':''}">${f>0?'на '+w+' мес':'—'}</b></div>`})()}<div class="lbl">Сырьё<b>${Object.keys(S.eq).map(m=>MAT[m].slice(0,4)+' ×'+R(S.idx[m])).join(', ')}</b></div></div>`;
  {const st=statsHtml();h+=`<details class="as" ${S.open.stat?'open':''} ontoggle="S.open.stat=this.open"><summary><span>📊 Статистика</span><span class="lbl">место ${st.rank} из ${S.bots.length+1}</span></summary>${st.html}</details>`}if(S.rp){const r=S.rp;h+=`<div class="rep"><div class="lbl">Итоги месяца ${r.m}</div><div><span>Выручка</span><span>${F(r.rev)}</span></div><div><span>Материалы</span><span>−${F(r.mat)}</span></div><div><span>Налог</span><span>−${F(r.tax)}</span></div><div><span>Аренда и зарплаты</span><span>−${F(r.rent+r.sal)}</span></div><div><span>Взносы и проценты</span><span>−${F(r.con+r.int)}</span></div><div><span>Реклама</span><span>−${F(r.ads)}</span></div><div class="t"><span>Чистая прибыль</span><span>${F(r.net)}</span></div></div>`}
  if(S.note)h+=`<div class="card"><h3>${S.note.t}</h3><p>${S.note.d}</p><button class="btn" onclick="S.note=null;draw()">Понятно</button></div>`;const c=S.cur;
  if(c){const l=c.l,p=P[l.i],f=eF(l);
   h+=`<div class="card"><h3>${p[1]}</h3>`+(c.df?`<p>Брак. Переделка потребует ${E(c.e)} сил и ещё ${F(l.K)} на материалы. Скидка клиенту: ${F(Math.round(c.pr*.7/10)*10)} вместо ${F(c.pr)}.</p><button class="btn" onclick="redo()" ${S.energy<c.e||S.cash<l.K?'disabled':''}>Переделать</button><button class="btn" onclick="disc()">Дать скидку клиенту</button>`
    :`<p>Цена ${F(c.pr)}, материалы ${F(l.K)}. Выбери, как делать заказ.</p><button class="btn" onclick="work(0)" ${S.energy<eM(l,0)||S.cash<l.K?'disabled':''}>Быстро: ${E(eM(l,0))} сил, возможен брак</button><button class="btn" onclick="work(1)" ${S.energy<eM(l,1)||S.cash<l.K?'disabled':''}>Обычно: ${E(eM(l,1))} сил, без брака, рейтинг растёт очень медленно</button><button class="btn" onclick="work(2)" ${S.energy<eM(l,2)||S.cash<l.K?'disabled':''}>Качественно: ${E(eM(l,2))} сил, рейтинг растёт заметно</button><button class="btn" onclick="cancel()">Отказаться от заказа</button>`)+`</div>`}
  if(S.ev)h+=`<div class="card"><h3>${S.ev.t}</h3><p>${S.ev.d}</p>${S.ev.o.map((o,i)=>`<button class="btn" onclick="evPick(${i})">${o[0]}</button>`).join('')}</div>`;
  h+=`<div class="row"><button class="btn p c" onclick="next()" ${S.ev||S.cur?'disabled':''}>Следующий месяц</button></div>`;
  h+=`<div class="sec">Заявки</div><div class="chips">${[['','Как есть'],['e','Меньше сил'],['p','Больше прибыли']].map(x=>`<button class="chip ${(S.sort||'')===x[0]?'on':''}" onclick="sortBy('${x[0]}')">${x[1]}</button>`).join('')}</div>${['acq','avito','soc','blog','card','biz'].concat(S.ip?['big']:[]).map(chRow).join('')}`;
  h+=`<div class="sec">Оборудование</div>`+Object.keys(S.eq).map(m=>{const q=S.eq[m],nx=LV[q.l];return`<div class="as"><div class="h">${MAT[m]}, ${q.l} ур.<span class="${q.b||100-q.cd>70?'r':100-q.cd>30?'y':'g'}">${q.b?'сломано':'износ '+(100-q.cd)+'%'}</span></div><div class="d">${LV[q.l-1][0]}. Выше уровень: меньше сил, меньше брака и отходов, сложнее заказы.</div><div class="row">${q.l<5?`<button class="btn s p" onclick="upg('${m}')" ${S.cash<nx[1]||q.l>=maxL()?'disabled':''}>Улучшить ${F(nx[1])}</button>`:''}<button class="btn s" onclick="svc('${m}')" ${S.cash<Math.round(eqP(m)*(q.b?.12:.04))||(!q.b&&q.cd>=100)?'disabled':''}>${q.b?'Починить':'Обслужить'} ${F(eqP(m)*(q.b?.12:.04))}</button></div></div>`}).join('');
  const n=Object.keys(S.eq).length;
  h+=Object.keys(MAT).filter(m=>!S.eq[m]).map(m=>`<div class="as"><div class="h">${MAT[m]}<span>${F(MP[m])}</span></div><div class="d">Нужны оборудование и опыт: ${NEED[Math.min(n,3)]} заказов.</div><div class="row"><button class="btn s p" onclick="unlock('${m}')" ${n>3||S.exp<NEED[n]||S.cash<MP[m]?'disabled':''}>Открыть</button></div></div>`).join('');
  h+=`<div class="sec">Помещения</div><div class="chips">${Object.keys(PREM).map(p=>`<button class="chip ${S.prem===p?'on':''}" onclick="setPrem('${p}')" ${p==='shop'&&!S.ip?'disabled':''}>${PREM[p][0]}${PREM[p][1]?', '+F(PREM[p][1]):''}</button>`).join('')}</div>`;
  h+=`<div class="chips"><button class="chip ${S.ws.wh?'on':''}" onclick="tog('wh')" ${S.ip?'':'disabled'}>Склад ${F(RENT.wh)}</button><button class="chip ${S.ws.off?'on':''}" onclick="tog('off')" ${S.ip?'':'disabled'}>Офис ${F(RENT.off)}</button></div><div class="d">Склад, офис, цех и сотрудники доступны после ИП. Офис даёт +20% заявок.</div>`;
  if(!S.ip)h+=`<div class="as"><div class="h">Оформить ИП<span>${F(REG)}</span></div><div class="d">Налог 6% и взносы ${F(CONTR)} в месяц. Открывает цех, склад, офис, сотрудников, крупных заказчиков.</div><div class="row"><button class="btn s p" onclick="regIP()" ${S.cash<REG?'disabled':''}>Оформить</button></div></div>`;
  else h+=`<div class="sec">Сотрудники: ${S.staff.length} из 10</div>`+Object.keys(STAFF).map(k=>{const hs=S.staff.filter(w=>w.r===k),o=S.pool.filter(x=>x.r===k);return`<details class="as" ${S.open['s'+k]?'open':''} ontoggle="S.open['s${k}']=this.open"><summary><span>${STAFF[k][0]}</span><span class="lbl">${hs.length?hs.length+' в штате':'нет'}</span></summary>${hs.map(w=>`<div class="row"><span class="d" style="flex:1">${w.n}, ${TN[w.t]}, ${F(w.pay)}: ${STAFF[k][2][w.t]}</span>${w.t<2?`<button class="btn s" onclick="train('${w.id}')" ${S.cash<Math.round(w.pay*3)?'disabled':''}>Обучить ${F(w.pay*3)}</button>`:''}<button class="btn s" onclick="fire('${w.id}')">Уволить</button></div>`).join('')}${S.staff.length<10?o.map(x=>`<button class="btn opt" onclick="hire('${x.id}')"><span>Нанять: ${x.n}, ${TN[x.t]}</span><span>${F(x.pay)} в месяц: ${STAFF[k][2][x.t]}</span></button>`).join('')||'<div class="d">Сейчас кандидатов нет.</div>':'<div class="d">Штат полный.</div>'}</details>`}).join('');
  if(S.ip)h+=`<div class="sec">Развитие</div>`+[['ooo','ООО',100000,'+20 сил, заказы от бизнеса на 30% крупнее. Бухгалтерия 15 000 ₽ в месяц.',1],['w2','Второй цех',500000,'+25 сил. Аренда 60 000 ₽ в месяц. Нужно ООО.','ooo'],['br','Филиал',1500000,'+40 сил и заявок на 25% больше. Аренда 120 000 ₽ в месяц. Нужен второй цех.','w2']].map(x=>`<div class="as"><div class="h">${x[1]}<span>${F(x[2])}</span></div><div class="d">${x[3]}</div><div class="row"><button class="btn s ${S.st[x[0]]?'':'p'}" onclick="buyst('${x[0]}')" ${S.st[x[0]]||S.cash<x[2]||(x[4]!==1&&!S.st[x[4]])?'disabled':''}>${S.st[x[0]]?'Открыто':'Открыть'}</button></div></div>`).join('');
  h+=`<div class="as"><div class="h">Кредит<span>18% годовых</span></div><div class="d">${S.debt>0?`Остаток ${F(S.debt)}, платёж ${F(S.lp)} в месяц, осталось ${S.ln} мес.`:'Платёж равными частями каждый месяц. Выбери кредит:'}</div><div class="row">${S.debt>0?`<button class="btn s" onclick="repay()" ${S.cash<S.debt?'disabled':''}>Погасить досрочно ${F(S.debt)}</button>`:LOANS.map(x=>`<button class="btn s p" onclick="loan(${x[0]},${x[1]})">${F(x[0])} на ${x[1]} мес, платёж ${F(lpay(x[0],x[1]))}</button>`).join('')}</div></div>`;
  h+=`<div class="log">${S.log.map(l=>`<div>${l}</div>`).join('')}</div><div class="row" style="margin-top:22px"><button class="btn s" onclick="expSave()">Скопировать сохранение</button><button class="btn s" onclick="impSave()">Загрузить сохранение</button></div><button class="link" onclick="if(confirm('Начать заново?'))again()">Начать заново</button>`}
 document.getElementById('app').innerHTML=h;if(S.up){S.up=0;window.scrollTo({top:0,behavior:'smooth'})}save()}
S=load();draw();
</script></body></html>
